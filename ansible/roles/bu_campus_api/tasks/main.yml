---
- name: Install OpenJDK 17 (headless JRE)
  ansible.builtin.apt:
    name: "{{ java_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the service group
  ansible.builtin.group:
    name: "{{ app_user }}"
    system: true

- name: Create the service user (no login shell, no home)
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Copy the Gradle-built JAR
  ansible.builtin.copy:
    src: "{{ jar_src }}"
    dest: "{{ jar_dest }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: restart bu-campus-api

- name: Write the environment file (PORT, APP_VERSION)
  ansible.builtin.template:
    src: bu-campus-api.env.j2
    dest: "{{ env_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart bu-campus-api

- name: Install the systemd unit
  ansible.builtin.template:
    src: bu-campus-api.service.j2
    dest: "/etc/systemd/system/{{ service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon reload
    - restart bu-campus-api

# Handlers run at the end of the play; flush now so the service is already on
# the new JAR/unit before the health check below.
- name: Run pending handlers now
  ansible.builtin.meta: flush_handlers

- name: Enable the service at boot and make sure it is running
  ansible.builtin.systemd_service:
    name: "{{ service_name }}"
    enabled: true
    state: started

- name: Check that /health returns 200
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    return_content: true
    status_code: 200
  register: health
  retries: "{{ health_retries }}"
  delay: "{{ health_delay }}"
  until: health.status == 200
  changed_when: false

- name: Show the health response
  ansible.builtin.debug:
    msg: "{{ health.content }}"
