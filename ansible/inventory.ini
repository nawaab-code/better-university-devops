# Target host: Ubuntu 24.04 container with real systemd (see target-host/).
[campus_api]
bu-target ansible_host=127.0.0.1 ansible_port=2222

[campus_api:vars]
ansible_user=deployer
ansible_ssh_private_key_file=~/.ssh/bu-ansible-demo
ansible_ssh_common_args='-o IdentitiesOnly=yes -o UserKnownHostsFile=/dev/null'
