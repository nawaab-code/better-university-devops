apiVersion: apps/v1
kind: Deployment
metadata:
  name: bu-campus-api
  labels:
    app: bu-campus-api
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bu-campus-api
      tier: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bu-campus-api
        tier: backend
    spec:
      containers:
        - name: bu-campus-api
          image: bu-campus-api:1.0.0
          # The image is loaded into kind with `kind load docker-image`, not pulled.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # PORT and APP_VERSION come from the ConfigMap.
          envFrom:
            - configMapRef:
                name: bu-campus-api-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
