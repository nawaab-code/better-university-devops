apiVersion: v1
kind: Service
metadata:
  name: bu-campus-api
  labels:
    app: bu-campus-api
spec:
  type: NodePort
  # Sends traffic to every Ready Pod carrying these labels.
  selector:
    app: bu-campus-api
    tier: backend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
