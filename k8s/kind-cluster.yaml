kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bu-campus
nodes:
  - role: control-plane
    extraPortMappings:
      # Expose the Service's NodePort on the Mac so curl localhost:30080 works.
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
        protocol: TCP
